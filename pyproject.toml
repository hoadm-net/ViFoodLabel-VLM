[project]
name = "vifoodlabel-vlm"
version = "0.1.0"
description = "Benchmark harness for zero-shot structured extraction from Vietnamese food label images with VLMs"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.10",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=2.1",
    "pillow>=11.0",
    "matplotlib>=3.9",
    "tenacity>=9.0",
    "tqdm>=4.67",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
    "json-repair>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vifoodlabel"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
